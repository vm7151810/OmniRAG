[project]
name = "omnirag-backend"
version = "0.1.0"
description = "Backend for OmniRAG Chatbot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "pypdf>=6.14.2",
    "pandas>=3.0.3",
    "sqlalchemy>=2.0.51",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.2.7",
    "reportlab>=5.0.0",
    "pinecone>=9.1.0",
    "google-genai>=2.12.1",
    "httpx2>=2.7.0",
    "flashrank>=0.2.10",
    "numpy>=2.4.6",
    "langgraph>=1.2.9",
    "langchain-community>=0.4.2",
    "pytest-asyncio>=1.4.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--reruns 3 --reruns-delay 5"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-rerunfailures>=16.4",
    "ruff>=0.15.21",
]
