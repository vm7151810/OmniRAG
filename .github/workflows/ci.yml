name: OmniRAG Enterprise CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-static-analysis:
    name: Backend Static Analysis (Ruff + Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: cd backend && uv sync --all-extras

      - name: Run Ruff (Formatting + Security SAST)
        run: cd backend && uv run ruff check .

      - name: Run Mypy (Type Enforcement)
        run: cd backend && uv run mypy .

  frontend-static-analysis:
    name: Frontend UI Validation (ESLint + TSC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run ESLint
        run: cd frontend && pnpm lint

      - name: Run TypeScript Compiler (Type Enforcement)
        run: cd frontend && pnpm exec tsc --noEmit

  backend-functional-tests:
    name: Backend Functional Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: cd backend && uv sync --all-extras

      - name: Run Pytest
        env:
          ENVIRONMENT: "test"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test-mock-key' }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY || 'test-mock-key' }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME || 'omnirag-index' }}
          LANGCHAIN_TRACING_V2: "false"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY || '' }}
        run: cd backend && uv run pytest tests/

  dependency-cve-scan:
    name: Dependency CVE Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          trivyignores: '.trivyignore'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
